name: Platform checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: "True"
      SECRET_KEY: "tatzo-ci-only"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      USE_CONSOLE_EMAIL: "True"
      USE_CLOUDINARY: "False"
      TATZO_RATE_LIMIT_ENABLED: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python manage.py test --verbosity 1

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile --ignore-scripts

      - name: Type-check mobile client
        run: npm run typecheck --prefix mobile

      - name: Check mobile release configuration
        run: npm run release:check --prefix mobile

      - name: Export mobile bundles
        working-directory: mobile
        run: ./node_modules/.bin/expo export --platform all --output-dir /tmp/tatzo-mobile-export
