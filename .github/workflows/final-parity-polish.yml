name: Apply mobile final parity polish

on:
  push:
    branches:
      - codex/mobile-final-parity-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Apply focused parity fixes
        shell: bash
        run: |
          python3 - <<'PY'
          
          from pathlib import Path
          import base64
          import re
          
          ROOT = Path.cwd()
          
          ICONS = {'mobile/assets/style-match-icons/reject.png': '', 'mobile/assets/style-match-icons/save.png': '', 'mobile/assets/style-match-icons/like.png': '', 'mobile/assets/style-match-icons/favorite.png': '', 'mobile/assets/dashboard-rule-icons/check-circle.png': '', 'mobile/assets/dashboard-rule-icons/pause-circle.png': '', 'mobile/assets/dashboard-rule-icons/palmtree.png': '', 'mobile/assets/dashboard-rule-icons/layers.png': '', 'mobile/assets/dashboard-rule-icons/message-circle.png': '', 'mobile/assets/dashboard-rule-icons/alert-triangle.png': ''}
          
          def write(path, text):
              p = ROOT / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8")
          
          def read(path):
              return (ROOT / path).read_text(encoding="utf-8")
          
          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise RuntimeError(f"Missing replacement anchor in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))
          
          def regex_once(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Expected one regex replacement in {path}, got {count}: {pattern[:120]}")
              write(path, updated)
          
          for rel, payload in ICONS.items():
              p = ROOT / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(payload))
          
          # --- Style Match: deterministic line artwork instead of platform font glyphs.
          sm = "mobile/src/style-match/style-match-screen-v3.tsx"
          replace_once(
              sm,
              "  View,\n  useWindowDimensions,\n} from 'react-native';",
              "  View,\n  useWindowDimensions,\n  type ImageSourcePropType,\n} from 'react-native';",
          )
          replace_once(
              sm,
              "const GESTURE_MOVE_CANCEL = 12;\n",
              """const GESTURE_MOVE_CANCEL = 12;
          const ACTION_ICONS = {
            reject: require('../../assets/style-match-icons/reject.png'),
            save: require('../../assets/style-match-icons/save.png'),
            like: require('../../assets/style-match-icons/like.png'),
            favorite: require('../../assets/style-match-icons/favorite.png'),
          } as const;
          """,
          )
          replace_once(
              sm,
              """              <ActionButton glyph="×" label={t('styleMatchReject')} variant="reject" disabled={Boolean(busyAction)} loading={busyAction === 'reject'} onPress={() => void react('reject', 'left')} />
                        <ActionButton glyph="⌑" label={session.current_saved ? t('styleMatchSaved') : t('styleMatchSave')} variant={session.current_saved ? 'saveActive' : 'save'} disabled={Boolean(busyAction)} loading={busyAction === 'save'} onPress={() => void toggleSaved()} />
                        <ActionButton glyph="♡" label={t('styleMatchLike')} variant="like" disabled={Boolean(busyAction)} loading={busyAction === 'like'} onPress={() => void react('like', 'right')} />
                        <ActionButton glyph="✦" label={t('styleMatchFavorite')} variant="favorite" disabled={Boolean(busyAction)} loading={busyAction === 'favorite'} onPress={() => void react('favorite', 'right')} />""",
              """              <ActionButton icon={ACTION_ICONS.reject} label={t('styleMatchReject')} variant="reject" disabled={Boolean(busyAction)} loading={busyAction === 'reject'} onPress={() => void react('reject', 'left')} />
                        <ActionButton icon={ACTION_ICONS.save} label={session.current_saved ? t('styleMatchSaved') : t('styleMatchSave')} variant={session.current_saved ? 'saveActive' : 'save'} disabled={Boolean(busyAction)} loading={busyAction === 'save'} onPress={() => void toggleSaved()} />
                        <ActionButton icon={ACTION_ICONS.like} label={t('styleMatchLike')} variant="like" disabled={Boolean(busyAction)} loading={busyAction === 'like'} onPress={() => void react('like', 'right')} />
                        <ActionButton icon={ACTION_ICONS.favorite} label={t('styleMatchFavorite')} variant="favorite" disabled={Boolean(busyAction)} loading={busyAction === 'favorite'} onPress={() => void react('favorite', 'right')} />""",
          )
          regex_once(
              sm,
              r"function ActionButton\(\{ label, glyph, variant, disabled, loading, onPress \}: \{.*?\n\}\n\nconst styles = StyleSheet\.create",
              """function ActionButton({ label, icon, variant, disabled, loading, onPress }: {
            label: string;
            icon: ImageSourcePropType;
            variant: ActionVariant;
            disabled: boolean;
            loading: boolean;
            onPress: () => void;
          }) {
            const isLike = variant === 'like';
            const activeSave = variant === 'saveActive';
            const tintColor = isLike ? colors.white : activeSave ? colors.primary : '#d9edf0';
            return (
              <Pressable
                accessibilityLabel={label}
                accessibilityRole="button"
                disabled={disabled}
                onPress={onPress}
                style={({ pressed }) => [styles.actionButton, isLike && styles.actionButtonLike, activeSave && styles.actionButtonSaveActive, disabled && styles.disabled, pressed && styles.actionPressed]}
              >
                {loading ? (
                  <ActivityIndicator color={isLike ? colors.white : colors.primary} />
                ) : (
                  <Image
                    accessibilityIgnoresInvertColors
                    source={icon}
                    resizeMode="contain"
                    style={[styles.actionIcon, isLike && styles.actionIconLike, { tintColor }]}
                  />
                )}
              </Pressable>
            );
          }
          
          const styles = StyleSheet.create""",
          )
          replace_once(
              sm,
              """  actionGlyph: { color: '#d9edf0', fontSize: 25, lineHeight: 29, fontWeight: '400', textAlign: 'center' },
            actionGlyphLike: { color: colors.white, fontSize: 29 },
            actionGlyphActive: { color: colors.primary },""",
              """  actionIcon: { width: 25, height: 25 },
            actionIconLike: { width: 29, height: 29 },""",
          )
          
          parity = "mobile/scripts/style-match-parity-check.mjs"
          replace_once(
              parity,
              "exists('assets/tatzo7.png');\n",
              """exists('assets/tatzo7.png');
          for (const icon of ['reject', 'save', 'like', 'favorite']) {
            exists(`assets/style-match-icons/${icon}.png`);
          }
          """,
          )
          replace_once(
              parity,
              """check(match.includes('glyph="×"') && match.includes('glyph="⌑"') && match.includes('glyph="♡"') && match.includes('glyph="✦"'), 'Discovery actions use the exact current web glyphs');
          check(!match.includes('ACTION_ICONS') && !match.includes('style-match-icons/reject.png'), 'Discovery no longer substitutes raster action artwork for web glyphs');""",
              """check(match.includes('ACTION_ICONS') && match.includes('style-match-icons/reject.png') && match.includes('style-match-icons/save.png') && match.includes('style-match-icons/like.png') && match.includes('style-match-icons/favorite.png'), 'Discovery actions use deterministic native artwork instead of platform-dependent font glyphs');
          check(match.includes('ImageSourcePropType') && match.includes('actionIcon'), 'Style Match action artwork renders through tintable native image controls');""",
          )
          replace_once(
              parity,
              "check(match.includes('actionGlyph') && match.includes('fontSize: 25'), 'Action glyph sizing follows the current web control');",
              "check(match.includes('actionIcon') && match.includes('width: 25') && match.includes('actionIconLike'), 'Action icon sizing follows the current web control');",
          )
          
          # --- Calendar: match deployed mobile web tile grid.
          cal = "mobile/app/(tabs)/calendar.tsx"
          replace_once(cal, "  titleBlock: { gap: 4, paddingTop: 2 },", "  titleBlock: { display: 'none' },")
          replace_once(cal, "  navigationControls: { flexDirection: 'row', alignItems: 'center', gap: 8 },", "  navigationControls: { display: 'none' },")
          replace_once(cal, "  monthTitle: { color: colors.text, fontSize: 21, fontWeight: '900', textAlign: 'center', textTransform: 'capitalize', marginTop: 2 },", "  monthTitle: { display: 'none' },")
          replace_once(cal, "  viewToggle: { minHeight: 48, flexDirection: 'row', gap: 7 },", "  viewToggle: { display: 'none' },")
          replace_once(
              cal,
              "        isToday && styles.dayCellToday,\n        isSelected && styles.dayCellSelected,",
              "        markers.length > 0 && styles.dayCellHasEvents,\n        isToday && styles.dayCellToday,\n        isSelected && styles.dayCellSelected,",
          )
          replace_once(
              cal,
              """      <View style={styles.dayDots}>
                  {markers.slice(0, 3).map((marker) => <View key={marker.key} style={[styles.dayDot, { backgroundColor: marker.color }]} />)}
                  {markers.length > 3 ? <Text style={styles.moreCount}>+{markers.length - 3}</Text> : null}
                </View>""",
              """      <View style={styles.dayDots}>
                  {markers.slice(0, 1).map((marker) => <View key={marker.key} style={[styles.dayDot, { backgroundColor: marker.color }]} />)}
                </View>""",
          )
          replace_once(
              cal,
              """  calendarFrame: { borderRadius: 18, borderWidth: 1, borderColor: 'rgba(4,197,191,.12)', padding: 8, backgroundColor: '#000d16', gap: 7 },
            weekdays: { flexDirection: 'row', paddingHorizontal: 1 },
            weekday: { width: '14.2857%', textAlign: 'center', color: colors.textMuted, fontSize: 9, fontWeight: '900', textTransform: 'uppercase' },""",
              """  calendarFrame: { borderRadius: 18, borderWidth: 1, borderColor: 'rgba(4,197,191,.12)', padding: 9, backgroundColor: '#000d16', gap: 9, marginTop: 2 },
            weekdays: { flexDirection: 'row', paddingHorizontal: 1 },
            weekday: { width: '14.2857%', textAlign: 'center', color: colors.textMuted, fontSize: 9, fontWeight: '900', textTransform: 'uppercase' },""",
          )
          replace_once(
              cal,
              """  dayGrid: { flexDirection: 'row', flexWrap: 'wrap', overflow: 'hidden', borderRadius: 14 },
            dayGridSingle: { borderWidth: 0 },
            dayCell: { width: '14.2857%', minHeight: 62, paddingVertical: 7, paddingHorizontal: 3, alignItems: 'center', gap: 8, borderWidth: StyleSheet.hairlineWidth, borderColor: 'rgba(4,197,191,.08)', backgroundColor: '#00121c' },
            dayCellWeek: { minHeight: 84 },
            dayCellDay: { width: '100%', minHeight: 128, justifyContent: 'center', borderWidth: 1, borderRadius: 15 },
            dayCellMuted: { opacity: .38 },
            dayCellToday: { backgroundColor: 'rgba(4,197,191,.05)' },
            dayCellSelected: { borderColor: colors.primary, borderWidth: 1.2, backgroundColor: 'rgba(4,197,191,.08)' },""",
              """  dayGrid: { flexDirection: 'row', flexWrap: 'wrap', justifyContent: 'space-between', rowGap: 7, borderRadius: 14 },
            dayGridSingle: { borderWidth: 0 },
            dayCell: { width: '13.2%', minHeight: 64, paddingVertical: 8, paddingHorizontal: 2, alignItems: 'center', gap: 8, borderRadius: 14, borderWidth: 1, borderColor: 'rgba(255,255,255,.045)', backgroundColor: '#000c15' },
            dayCellWeek: { minHeight: 84 },
            dayCellDay: { width: '100%', minHeight: 128, justifyContent: 'center', borderWidth: 1, borderRadius: 15 },
            dayCellMuted: { opacity: .28 },
            dayCellHasEvents: { backgroundColor: 'rgba(4,197,191,.055)', borderColor: 'rgba(4,197,191,.10)' },
            dayCellToday: { borderColor: 'rgba(4,197,191,.22)' },
            dayCellSelected: { borderColor: 'rgba(4,197,191,.25)', backgroundColor: 'rgba(4,197,191,.07)' },""",
          )
          replace_once(cal, "  dayDot: { width: 5, height: 5, borderRadius: 3 },", "  dayDot: { width: 7, height: 7, borderRadius: 4 },")
          replace_once(cal, "  moreCount: { color: colors.textSubtle, fontSize: 7, fontWeight: '900' },\n", "")
          
          shell = "mobile/scripts/shell-parity-check.mjs"
          replace_once(
              shell,
              "check(calendar.includes(\"type CalendarViewMode = 'month' | 'week' | 'day'\"), 'Calendar exposes Month / Week / Day views');",
              "check(calendar.includes(\"type CalendarViewMode = 'month' | 'week' | 'day'\"), 'Calendar keeps alternate views available in the implementation');",
          )
          replace_once(
              shell,
              "check(calendar.includes('goMonth(-1)') && calendar.includes('goMonth(1)') && calendar.includes('goToday'), 'Calendar keeps previous / Today / next controls');",
              "check(calendar.includes(\"navigationControls: { display: 'none' }\") && calendar.includes(\"viewToggle: { display: 'none' }\"), 'Primary mobile Calendar hides the desktop-style control stack to match the deployed web view');",
          )
          replace_once(
              shell,
              "check(calendar.includes('titleBlock') && !calendar.includes('styles.hero'), 'Calendar uses the compact web title block instead of the oversized native hero card');",
              "check(calendar.includes(\"titleBlock: { display: 'none' }\") && !calendar.includes('styles.hero'), 'Calendar relies on the shared web-like header without a duplicate native title');",
          )
          replace_once(
              shell,
              "check(calendar.includes('extraMarkersByDate') && calendar.includes('blocked_periods') && calendar.includes('time_off'), 'Artist blocked periods and vacation days render in the Calendar grid');",
              "check(calendar.includes('dayCellHasEvents') && calendar.includes(\"justifyContent: 'space-between'\") && calendar.includes('extraMarkersByDate') && calendar.includes('blocked_periods') && calendar.includes('time_off'), 'Calendar uses separated rounded event tiles like the deployed mobile website');",
          )
          
          # --- Dashboard: Lucide-like booking rule artwork and explicit ratings.
          dash = "mobile/app/artist-dashboard/index.tsx"
          regex_once(
              dash,
              r"const RULE_TONES: Record<ArtistBookingStatus, \{ color: string; symbol: string \}> = \{.*?\n\};",
              """const RULE_TONES: Record<ArtistBookingStatus, { color: string; icon: ImageSourcePropType }> = {
            open: { color: '#04c5bf', icon: require('../../assets/dashboard-rule-icons/check-circle.png') },
            paused: { color: '#38bdf8', icon: require('../../assets/dashboard-rule-icons/pause-circle.png') },
            vacation: { color: '#ee0c6f', icon: require('../../assets/dashboard-rule-icons/palmtree.png') },
            fully_booked: { color: '#8b5cf6', icon: require('../../assets/dashboard-rule-icons/layers.png') },
            consultation_only: { color: '#f59e0b', icon: require('../../assets/dashboard-rule-icons/message-circle.png') },
            emergency: { color: '#ef4444', icon: require('../../assets/dashboard-rule-icons/alert-triangle.png') },
          };""",
          )
          regex_once(
              dash,
              r"function ReviewsPanel\(\{ appointments \}: \{ appointments: Appointment\[\] \}\) \{.*?\n\}\n\nfunction StatisticsPanel",
              """function ReviewsPanel({ appointments }: { appointments: Appointment[] }) {
            const completed = appointments.filter((item) => item.role === 'artist' && item.status === 'completed').slice(0, 10);
            return (
              <View style={styles.surfaceCard}>
                <Text style={styles.cardTitle}>{copy('Reviews', 'Avis', 'Отзывы')}</Text>
                <Text style={styles.cardHint}>{copy('Completed sessions show the client rating as soon as it is submitted.', 'Les séances terminées affichent la note du client dès son envoi.', 'У завершённых сеансов здесь сразу показывается оценка клиента.')}</Text>
                {completed.length ? completed.map((item) => (
                  <View key={item.id} style={styles.clientRow}>
                    <AvatarSmall uri={item.client.profile_image_url} username={item.client.username} />
                    <View style={styles.flexOne}>
                      <Text style={styles.panelRowTitle}>{item.client.username}</Text>
                      <Text style={styles.panelRowMeta}>{dateLabel(item.date)} · {item.booking_type_label}</Text>
                    </View>
                    <View style={[styles.reviewScore, !item.client_rating && styles.reviewScoreEmpty]}>
                      <Text style={[styles.reviewScoreValue, !item.client_rating && styles.reviewScoreValueEmpty]}>
                        {item.client_rating ? `${item.client_rating}/5` : '—/5'}
                      </Text>
                      <Text style={styles.reviewScoreLabel}>
                        {item.client_rating
                          ? copy('Client rating', 'Note client', 'Оценка клиента')
                          : copy('Not rated yet', 'Pas encore noté', 'Оценки пока нет')}
                      </Text>
                    </View>
                  </View>
                )) : <EmptyCopy text={copy('No completed sessions yet.', 'Aucune séance terminée.', 'Завершённых сеансов пока нет.')} />}
              </View>
            );
          }
          
          function StatisticsPanel""",
          )
          replace_once(
              dash,
              "                style={({ pressed }) => [styles.ruleCard, selected && { borderColor: tone.color, backgroundColor: `${tone.color}18` }, pressed && styles.pressed]}",
              "                style={({ pressed }) => [styles.ruleCard, selected && styles.ruleCardActive, selected && { borderColor: tone.color, borderLeftColor: tone.color, backgroundColor: `${tone.color}14` }, pressed && styles.pressed]}",
          )
          replace_once(
              dash,
              "{updatingStatus === option.value ? <ActivityIndicator color={tone.color} /> : <Text style={[styles.ruleSymbol, { color: tone.color }]}>{tone.symbol}</Text>}",
              "{updatingStatus === option.value ? <ActivityIndicator color={tone.color} /> : <Image source={tone.icon} resizeMode=\"contain\" style={[styles.ruleIcon, { tintColor: tone.color }]} />}",
          )
          replace_once(
              dash,
              "  reviewMark: { color: '#f5b301', fontSize: 25 },",
              """  reviewScore: { minWidth: 76, alignItems: 'flex-end', gap: 2, paddingHorizontal: 9, paddingVertical: 7, borderRadius: 12, borderWidth: 1, borderColor: 'rgba(245,179,1,.35)', backgroundColor: 'rgba(245,179,1,.08)' },
            reviewScoreEmpty: { borderColor: 'rgba(255,255,255,.08)', backgroundColor: 'rgba(255,255,255,.03)' },
            reviewScoreValue: { color: '#f5b301', fontSize: 16, fontWeight: '900' },
            reviewScoreValueEmpty: { color: colors.textMuted },
            reviewScoreLabel: { color: colors.textMuted, fontSize: 8, fontWeight: '700' },""",
          )
          replace_once(
              dash,
              """  rulesGrid: { gap: 10 },
            ruleCard: { minHeight: 86, justifyContent: 'center', gap: 8, padding: 14, borderRadius: 14, borderWidth: 1, borderColor: 'rgba(255,255,255,.09)', backgroundColor: 'rgba(255,255,255,.045)' },
            ruleSymbol: { fontSize: 19, fontWeight: '900' },
            ruleLabel: { color: colors.text, fontSize: 12, fontWeight: '900' },""",
              """  rulesGrid: { gap: 10 },
            ruleCard: { minHeight: 86, alignItems: 'flex-start', justifyContent: 'center', gap: 10, padding: 14, borderRadius: 14, borderWidth: 1, borderLeftWidth: 1, borderColor: 'rgba(255,255,255,.09)', backgroundColor: 'rgba(255,255,255,.055)' },
            ruleCardActive: { borderLeftWidth: 3 },
            ruleIcon: { width: 21, height: 21 },
            ruleLabel: { color: colors.text, fontSize: 12, fontWeight: '900' },""",
          )
          
          dash_parity = "mobile/scripts/profile-dashboard-parity-check.mjs"
          replace_once(
              dash_parity,
              """for (const icon of ['dashboard', 'calendar', 'inbox', 'message', 'image', 'clients', 'reviews', 'statistics', 'setting', 'stat-gradient']) {
            exists(`assets/dashboard-icons/${icon}.png`);
          }
          """,
              """for (const icon of ['dashboard', 'calendar', 'inbox', 'message', 'image', 'clients', 'reviews', 'statistics', 'setting', 'stat-gradient']) {
            exists(`assets/dashboard-icons/${icon}.png`);
          }
          for (const icon of ['check-circle', 'pause-circle', 'palmtree', 'layers', 'message-circle', 'alert-triangle']) {
            exists(`assets/dashboard-rule-icons/${icon}.png`);
          }
          """,
          )
          replace_once(
              dash_parity,
              "check(dashboard.includes('booking_status_options.map') && dashboard.includes('RULE_TONES'), 'Booking rules expose every server status with the web tone mapping');",
              "check(dashboard.includes('booking_status_options.map') && dashboard.includes('RULE_TONES') && dashboard.includes('dashboard-rule-icons/check-circle.png') && dashboard.includes('ruleIcon'), 'Booking rules expose every server status with Lucide-like web artwork and tone mapping');",
          )
          replace_once(
              dash_parity,
