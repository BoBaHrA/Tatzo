              operations = [
                  migrations.AddField(
                      model_name="appointment",
                      name="client_rating",
                      field=models.PositiveSmallIntegerField(blank=True, null=True),
                  ),
              ]
          """
          write("appointments/migrations/0009_appointment_client_rating.py", migration)
          
          booking_views = "mobile_api/booking_views.py"
          replace_once(
              booking_views,
              '        "artist_note": appointment.artist_note if role == "artist" else "",\n',
              '        "artist_note": appointment.artist_note if role == "artist" else "",\n        "client_rating": appointment.client_rating,\n',
          )
          rating_class = """
          
          class AppointmentRatingView(APIView):
              permission_classes = (IsAuthenticated,)
          
              def put(self, request, appointment_id):
                  try:
                      rating = int(request.data.get("rating"))
                  except (TypeError, ValueError):
                      return Response(
                          {"code": "invalid_rating", "detail": "Rating must be an integer from 1 to 5."},
                          status=status.HTTP_400_BAD_REQUEST,
                      )
                  if rating < 1 or rating > 5:
                      return Response(
                          {"code": "invalid_rating", "detail": "Rating must be from 1 to 5."},
                          status=status.HTTP_400_BAD_REQUEST,
                      )
          
                  with transaction.atomic():
                      appointment = get_object_or_404(
                          Appointment.objects.select_for_update(),
                          pk=appointment_id,
                      )
                      if appointment.client_id != request.user.pk:
                          return Response(
                              {"code": "not_client", "detail": "Only the client can rate this appointment."},
                              status=status.HTTP_403_FORBIDDEN,
