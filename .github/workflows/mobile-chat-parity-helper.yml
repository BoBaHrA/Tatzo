name: Mobile chat parity helper

on:
  push:
    branches:
      - agent/mobile-chat-parity
    paths:
      - .github/workflows/mobile-chat-parity-helper.yml

permissions:
  contents: write

jobs:
  patch-chat-thread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-chat-parity
          fetch-depth: 0
      - name: Apply Tatzo web chat parity styles
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/app/chat/[threadId].tsx')
          text = path.read_text()

          replacements = {
              """                <Text numberOfLines={1} style={styles.headerTag}>\n                  @{thread.other_user.tag ?? thread.other_user.username}\n                </Text>""": """                <Text numberOfLines={1} style={styles.headerTag}>\n                  {thread.other_user.is_verified_artist\n                    ? t('artist')\n                    : `@${thread.other_user.tag ?? thread.other_user.username}`}\n                </Text>""",
              """  topBar: {\n    minHeight: 66,\n    flexDirection: 'row',\n    alignItems: 'center',\n    paddingHorizontal: spacing.sm,\n    borderBottomWidth: 1,\n    borderBottomColor: colors.border,\n    backgroundColor: colors.backgroundDeep,\n  },""": """  topBar: {\n    minHeight: 72,\n    flexDirection: 'row',\n    alignItems: 'center',\n    paddingHorizontal: spacing.sm,\n    borderBottomWidth: 1,\n    borderBottomColor: 'rgba(4, 197, 191, 0.18)',\n    backgroundColor: 'rgba(0, 18, 28, 0.98)',\n  },""",
              """  headerAvatar: { width: 42, height: 42, borderRadius: 21 },""": """  headerAvatar: {\n    width: 46,\n    height: 46,\n    borderRadius: 23,\n    borderWidth: 2,\n    borderColor: colors.primary,\n  },""",
              """    width: 42,\n    height: 42,\n    borderRadius: 21,\n    alignItems: 'center',\n    justifyContent: 'center',\n    backgroundColor: colors.primary,""": """    width: 46,\n    height: 46,\n    borderRadius: 23,\n    alignItems: 'center',\n    justifyContent: 'center',\n    backgroundColor: 'rgba(4, 197, 191, 0.09)',\n    borderWidth: 2,\n    borderColor: colors.primary,""",
              """  headerAvatarLetter: { color: colors.backgroundDeep, fontSize: 17, fontWeight: '900' },""": """  headerAvatarLetter: { color: colors.primary, fontSize: 17, fontWeight: '900' },""",
              """  blockButton: {\n    width: 70,\n    minHeight: 38,\n    alignItems: 'center',\n    justifyContent: 'center',\n    paddingHorizontal: spacing.xs,\n  },""": """  blockButton: {\n    minWidth: 68,\n    minHeight: 38,\n    alignItems: 'center',\n    justifyContent: 'center',\n    paddingHorizontal: spacing.sm,\n    borderRadius: 12,\n    borderWidth: 1,\n    borderColor: 'rgba(255, 87, 127, 0.28)',\n    backgroundColor: 'rgba(255, 87, 127, 0.06)',\n  },""",
              """  messagesContent: {\n    width: '100%',\n    maxWidth: 720,\n    alignSelf: 'center',\n    padding: spacing.md,\n    gap: 5,\n  },""": """  messagesContent: {\n    width: '100%',\n    maxWidth: 720,\n    alignSelf: 'center',\n    paddingHorizontal: 14,\n    paddingVertical: 16,\n    gap: 10,\n  },""",
              """  bubble: {\n    maxWidth: '84%',\n    minWidth: 70,\n    paddingHorizontal: 11,\n    paddingVertical: 7,\n    borderRadius: 17,\n    gap: 6,\n  },\n  mineBubble: {\n    backgroundColor: colors.primaryMuted,\n    borderBottomRightRadius: 5,\n  },\n  theirBubble: {\n    backgroundColor: colors.surfaceRaised,\n    borderBottomLeftRadius: 5,\n  },""": """  bubble: {\n    maxWidth: '88%',\n    minWidth: 70,\n    paddingHorizontal: 14,\n    paddingVertical: 10,\n    borderRadius: 18,\n    borderWidth: 1,\n    gap: 7,\n  },\n  mineBubble: {\n    backgroundColor: 'rgba(4, 197, 191, 0.14)',\n    borderColor: 'rgba(4, 197, 191, 0.22)',\n    borderBottomRightRadius: 6,\n  },\n  theirBubble: {\n    backgroundColor: 'rgba(255, 255, 255, 0.045)',\n    borderColor: 'rgba(255, 255, 255, 0.07)',\n    borderBottomLeftRadius: 6,\n  },""",
              """  imageAttachmentButton: { borderRadius: radius.small, overflow: 'hidden' },\n  imageAttachment: { width: 230, maxWidth: '100%', height: 205, backgroundColor: colors.backgroundDeep },""": """  imageAttachmentButton: {\n    borderRadius: 14,\n    overflow: 'hidden',\n    borderWidth: 1,\n    borderColor: 'rgba(4, 197, 191, 0.16)',\n  },\n  imageAttachment: { width: 230, maxWidth: '100%', height: 205, backgroundColor: colors.backgroundDeep },""",
              """    borderRadius: radius.small,\n    backgroundColor: 'rgba(0, 10, 18, 0.42)',\n    padding: spacing.sm,""": """    borderRadius: 12,\n    borderWidth: 1,\n    borderColor: 'rgba(4, 197, 191, 0.18)',\n    backgroundColor: 'rgba(4, 197, 191, 0.10)',\n    padding: spacing.sm,""",
              """  composerWrap: {\n    borderTopWidth: 1,\n    borderTopColor: colors.border,\n    backgroundColor: colors.backgroundDeep,\n    paddingTop: spacing.xs,\n  },""": """  composerWrap: {\n    borderTopWidth: 1,\n    borderTopColor: 'rgba(4, 197, 191, 0.12)',\n    backgroundColor: 'rgba(0, 13, 24, 0.94)',\n    paddingTop: spacing.xs,\n  },""",
              """  composer: {\n    flexDirection: 'row',\n    alignItems: 'flex-end',\n    gap: spacing.xs,\n    paddingHorizontal: spacing.sm,\n    paddingBottom: spacing.sm,\n  },""": """  composer: {\n    flexDirection: 'row',\n    alignItems: 'flex-end',\n    gap: 8,\n    paddingHorizontal: 10,\n    paddingBottom: 10,\n  },""",
              """    borderRadius: 23,\n    backgroundColor: colors.surfaceRaised,\n    borderWidth: 1,\n    borderColor: colors.border,""": """    borderRadius: 15,\n    backgroundColor: 'rgba(4, 197, 191, 0.10)',\n    borderWidth: 1,\n    borderColor: 'rgba(4, 197, 191, 0.24)',""",
              """    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n    borderRadius: 23,""": """    backgroundColor: 'rgba(0, 18, 28, 0.96)',\n    borderWidth: 1,\n    borderColor: 'rgba(4, 197, 191, 0.22)',\n    borderRadius: 15,""",
              """    borderRadius: 23,\n    backgroundColor: colors.primary,\n  },""": """    borderRadius: 15,\n    backgroundColor: colors.primary,\n  },""",
          }

          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old.splitlines()[0][:80])
              else:
                  text = text.replace(old, new, 1)

          if missing:
              raise SystemExit('Expected chat source snippets missing: ' + ' | '.join(missing))

          path.write_text(text)
          PY
      - name: Verify mobile typecheck and release gates
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm run release:check
      - name: Commit chat parity pass
        run: |
          git config user.name "Tatzo CI"
          git config user.email "actions@users.noreply.github.com"
          git add 'mobile/app/chat/[threadId].tsx'
          git commit -m "Bring mobile chat thread closer to web parity"
          git push origin HEAD:agent/mobile-chat-parity
