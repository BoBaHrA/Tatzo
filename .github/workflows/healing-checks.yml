name: Healing checks

on:
  pull_request:
    paths:
      - "healing/**"
      - "mytattooapp/settings.py"
      - "mytattooapp/urls.py"
      - "templates/base.html"
      - ".github/workflows/healing-checks.yml"
  workflow_dispatch:

jobs:
  healing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "True"
      SECRET_KEY: "tatzo-healing-ci"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      USE_CONSOLE_EMAIL: "True"
      USE_CLOUDINARY: "False"
      TATZO_RATE_LIMIT_ENABLED: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run Healing tests
        run: python manage.py test healing --verbosity 2

      - name: Check JavaScript syntax
        run: |
          node --check healing/static/healing/healing.js
          node --check healing/static/healing/healing_bridge.js
