name: Apply Style Match result persistence patch

on:
  push:
    branches:
      - codex/mobile-style-match-result-persistence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Patch active Style Match flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing target: {label}')
              return text.replace(old, new, 1)

          screen_path = Path('mobile/src/style-match/style-match-screen-v3.tsx')
          screen = screen_path.read_text(encoding='utf-8')
          screen = replace_once(
              screen,
              "import { useCallback, useEffect, useRef, useState } from 'react';",
              "import { useCallback, useEffect, useRef, useState } from 'react';\nimport { useFocusEffect } from 'expo-router';",
              'focus import',
          )
          screen = replace_once(
              screen,
              "import { StyleMatchResultV2 } from '@/style-match/style-match-result-v2';",
              "import { StyleMatchResultV3 } from '@/style-match/style-match-result-v3';",
              'result v3 import',
          )
          screen = replace_once(
              screen,
              "      setLatestResult(overview.latest_result);\n      setPreviewCards(preview.cards.slice(0, 3));\n      setSession(null);\n      setMode('intro');",
              "      setLatestResult(overview.latest_result);\n      setPreviewCards(preview.cards.slice(0, 3));\n      setPendingResult(null);\n      if (overview.active_session) {\n        setSession(overview.active_session);\n        setResult(null);\n        setMode('quiz');\n      } else if (overview.latest_result) {\n        setSession(null);\n        setResult(overview.latest_result);\n        setMode('result');\n      } else {\n        setSession(null);\n        setResult(null);\n        setMode('intro');\n      }",
              'overview persistence routing',
          )
          screen = replace_once(
              screen,
              "  useEffect(() => { void loadOverview(); }, [loadOverview]);",
              "  useFocusEffect(useCallback(() => {\n    void loadOverview();\n  }, [loadOverview]));",
              'focus overview reload',
          )
          screen = replace_once(
              screen,
              "        <StyleMatchResultV2 result={result} onRestart={() => setMode('intro')} restarting={starting} />",
              "        <StyleMatchResultV3 result={result} onRestart={() => void beginMatch()} restarting={starting} />",
              'result v3 render and restart',
          )
          screen_path.write_text(screen, encoding='utf-8')

          parity_path = Path('mobile/scripts/style-match-parity-check.mjs')
          parity = parity_path.read_text(encoding='utf-8')
          parity = replace_once(
              parity,
              "const result = source('src/style-match/style-match-result-v2.tsx');",
              "const result = source('src/style-match/style-match-result-v3.tsx');",
              'v3 parity source',
          )
          parity = replace_once(
              parity,
              "check(match.includes(\"setSession(null);\") && match.includes(\"setMode('intro')\"), 'Opening Style Match always shows onboarding before discovery');",
              "check(match.includes('overview.active_session') && match.includes(\"setMode('quiz')\") && match.includes('overview.latest_result') && match.includes(\"setMode('result')\"), 'Opening Style Match resumes an active session or restores the latest completed result');\ncheck(match.includes('useFocusEffect') && match.includes('void loadOverview()'), 'Style Match refreshes saved state when the tab regains focus');",
              'persistence parity guard',
          )
          parity = replace_once(
              parity,
              "check(result.includes('personalityCard') && result.includes('personalityShade'), 'Tattoo personality keeps the web pink reveal treatment');",
              "check(result.includes('personalityCard') && result.includes('personalityDeep') && result.includes('personalityGlow'), 'Tattoo personality mirrors the web pink-to-deep-magenta reveal treatment');",
              'personality v3 guard',
          )
          parity = replace_once(
              parity,
              "check(result.includes(\"router.replace('/(tabs)/home')\"), 'Completed results keep a safe path back home');",
              "check(result.includes(\"router.replace('/(tabs)/home')\"), 'Completed results keep a safe path back home');\ncheck(result.includes('result.styles.slice(0, 5)') && result.includes('communityHeadline'), 'Result mood tags and community copy follow the deployed web result composition');",
              'v3 composition guard',
          )
          parity_path.write_text(parity, encoding='utf-8')
          PY
          git diff --check
          node --check mobile/scripts/style-match-parity-check.mjs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/src/style-match/style-match-screen-v3.tsx mobile/scripts/style-match-parity-check.mjs
          git commit -m 'Restore saved Style Match results and activate result v3'
          git push origin HEAD:${{ github.ref_name }}
