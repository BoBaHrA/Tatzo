name: Mobile lock sync

on:
  push:
    branches:
      - agent/mobile-leaflet-map-parity
    paths:
      - .github/workflows/mobile-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: agent/mobile-leaflet-map-parity
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Align mobile map dependencies
        working-directory: mobile
        run: |
          npm pkg set 'dependencies.@expo/metro-runtime=~57.0.12'
          npm pkg delete dependencies.react-native-maps
          npm install --package-lock-only --ignore-scripts

      - name: Commit package metadata
        run: |
          if git diff --quiet -- mobile/package.json mobile/package-lock.json; then
            echo 'Package metadata already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/package.json mobile/package-lock.json
          git commit -m 'Align Leaflet DOM runtime dependencies'
          git push origin HEAD:agent/mobile-leaflet-map-parity
