name: Fix PR 134 typecheck

on:
  push:
    branches:
      - codex/mobile-final-parity-polish

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Fix nullable rating style condition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('mobile/app/appointment/[appointmentId].tsx')
          text = path.read_text(encoding='utf-8')
          old = "appointment.client_rating && rating <= appointment.client_rating && styles.ratingStarActive"
          new = "Boolean(appointment.client_rating && rating <= appointment.client_rating) && styles.ratingStarActive"
          if old not in text:
              raise SystemExit('target expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git rm .github/workflows/fix-pr134-typecheck.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix nullable rating style typecheck"
          git push origin HEAD:${{ github.ref_name }}
