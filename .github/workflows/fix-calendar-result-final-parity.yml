name: Apply final Calendar and Style Match parity

on:
  push:
    branches:
      - codex/mobile-calendar-result-final-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Apply focused parity fixes
        run: |
          python3 .github/scripts/apply-final-calendar-result-parity.py
          git diff --check
          node --check mobile/scripts/style-match-parity-check.mjs
          node --check mobile/scripts/shell-parity-check.mjs
      - name: Commit parity fix
        run: |
          git rm .github/workflows/fix-calendar-result-final-parity.yml
          git rm .github/scripts/apply-final-calendar-result-parity.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish Calendar controls and Style Match results"
          git push origin HEAD:${{ github.ref_name }}
