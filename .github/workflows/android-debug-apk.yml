name: Android Debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'build/android-preview-apk-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CI: "1"
      EXPO_PUBLIC_API_BASE_URL: "https://tatzo.eu/api/v1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate mobile client
        working-directory: mobile
        run: |
          npm run typecheck
          npm run release:check

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Compile Android debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Verify debug APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk out/tatzo-android-debug.apk
          test "$(wc -c < out/tatzo-android-debug.apk)" -gt 1000000
          unzip -tq out/tatzo-android-debug.apk >/dev/null
          unzip -Z1 out/tatzo-android-debug.apk | grep -q '^AndroidManifest.xml$'
          (cd out && sha256sum tatzo-android-debug.apk > SHA256SUMS.txt)
          {
            echo "### Android debug APK"
            echo "Build source: \`$GITHUB_SHA\`"
            echo "This APK is **debug-signed**, not EAS-signed, so it may require removal of an existing differently signed Tatzo installation."
            echo "Never uninstall the existing app without backing up local data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tatzo-android-debug-apk
          path: out/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
