name: Apply final mobile UX fixes

on:
  push:
    branches:
      - codex/mobile-final-ux-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Apply focused mobile fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_final_ux.py
          python3 /tmp/apply_final_ux.py
          git diff --check
      - name: Commit final UX fixes
        shell: bash
        run: |
          git rm .github/workflows/apply-final-ux-fixes.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix final mobile Style Match, composer and Calendar UX"
          git push origin HEAD:${{ github.ref_name }}
