name: Full system checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  web-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEBUG: "True"
      SECRET_KEY: "tatzo-full-system-ci"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      USE_CONSOLE_EMAIL: "True"
      USE_CLOUDINARY: "False"
      TATZO_RATE_LIMIT_ENABLED: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Django system check
        run: python manage.py check

      - name: Django deployment check
        run: python manage.py check --deploy

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput --verbosity 1

      - name: Run complete Django test suite
        run: python manage.py test --verbosity 2

      - name: Check project JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find static healing style_match health_safety -type f -name '*.js' -print0 2>/dev/null \
            | xargs -0 -r -n1 node --check
